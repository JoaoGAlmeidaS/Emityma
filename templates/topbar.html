{% load static %}
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow" aria-label="Barra superior">
    <a class="navbar-brand mr-3" href="{% url 'dashboard' %}">
        <img src="{% static 'img/logo/logo.png' %}" alt="Emityma" height="40">
    </a>

    {% if show_dashboard_btn %}
    <a class="btn btn-success" href="{% url 'dashboard' %}">Voltar ao Dashboard</a>
    {% else %}
    <a class="btn btn-success" href="{% url 'cadastrar_fazenda' %}">Cadastrar Fazenda</a>
    {% endif %}

    <ul class="navbar-nav ml-auto">
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <span class="mr-2 d-none d-lg-inline text-gray-600 small">{{ usuario.usuario_nome }}</span>
                <i class="fas fa-user-circle fa-lg text-gray-400" aria-hidden="true"></i>
                <span class="sr-only">Menu do usuário</span>
            </a>
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in" aria-labelledby="userDropdown">
                <a class="dropdown-item" href="{% url 'dashboard' %}">
                    <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400" aria-hidden="true"></i>
                    Selecionar fazenda
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="{% if STATIC_DEMO %}{% url 'home' %}{% else %}{% url 'sair' %}{% endif %}">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400" aria-hidden="true"></i>
                    Sair
                </a>
            </div>
        </li>
    </ul>
</nav>
