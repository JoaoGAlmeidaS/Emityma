{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página não encontrada · Emityma</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/acessibilidade.css' %}">
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: #f8f9fc;
            color: #3a3b45;
            font-family: Nunito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
        }
        main { max-width: 32rem; }
        img { width: 220px; max-width: 70%; height: auto; }
        .codigo { margin: 1rem 0 0; font-size: 4rem; font-weight: 800; color: #20734c; line-height: 1; }
        h1 { margin: .5rem 0 1rem; font-size: 1.5rem; }
        p { line-height: 1.6; }
        .acoes { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.5rem; }
        .botao {
            display: inline-block;
            padding: .6rem 1.2rem;
            border: 2px solid #20734c;
            border-radius: .35rem;
            color: #20734c;
            font-weight: 700;
            text-decoration: none;
        }
        .botao-principal { background: #20734c; color: #fff; }
        .botao:hover { background: #1b5e3f; border-color: #1b5e3f; color: #fff; }
    </style>
</head>
<body>
    <main>
        <a href="{% url 'home' %}"><img src="{% static 'img/logo/logo.png' %}" alt="Emityma — página inicial"></a>
        <p class="codigo" aria-hidden="true">404</p>
        <h1>Página não encontrada</h1>
        <p>O endereço acessado não existe ou foi removido.{% if STATIC_DEMO %} Nesta demonstração estática, apenas as páginas de exemplo estão disponíveis.{% endif %}</p>
        <div class="acoes">
            <a class="botao botao-principal" href="{% url 'home' %}">Ir para a página inicial</a>
            <a class="botao" href="{% url 'dashboard' %}">Abrir o painel</a>
        </div>
    </main>
</body>
</html>
