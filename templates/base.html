{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Emityma — sistema de gestão de fazendas.">
    <title>{% block title %}Emityma{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:400,400i,700,800&amp;display=swap" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
    <link href="{% static 'css/acessibilidade.css' %}" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    {% include "_demo_banner.html" %}
    {% include "topbar.html" %}

    <main id="conteudo" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    {% if STATIC_DEMO %}<script src="{% static 'js/demo.js' %}"></script>{% endif %}
</body>
</html>
